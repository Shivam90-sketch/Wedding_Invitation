<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>Shraddha Shukla & Rohit Mishra | Wedding Invitation</title>


    <!-- Google Fonts -->

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Montserrat:wght@300;400;500;600&family=Noto+Serif+Devanagari:wght@400;500;600&display=swap"
        rel="stylesheet"
    >


    <!-- New Jaipur Palace CSS -->

    <link
        rel="stylesheet"href="door.css"
    >

	<script src="music-player.js" defer></script>
</head>


<body>


<main class="jaipur-page">

	<audio id="weddingMusic" loop preload="auto">
		    <source src="Flute Ringtone.mp3" type="audio/mpeg">
	</audio>


    <!-- =====================================
         BACKGROUND
    ====================================== -->

    <div class="background-glow"></div>

    <div class="background-pattern"></div>


    <!-- Floating decorative elements -->

    <span class="floating flower flower-1">✿</span>
    <span class="floating flower flower-2">✿</span>
    <span class="floating star star-1">✦</span>
    <span class="floating star star-2">✧</span>


    <!-- =====================================
         TOP TEXT
    ====================================== -->

    <header class="royal-header">

        <div class="header-line"></div>

        <div class="header-content">

            <span class="header-symbol">❖</span>

            <span>
                SHUBH VIVAH
            </span>

            <span class="header-symbol">❖</span>

        </div>

        <div class="header-line"></div>

    </header>


    <!-- =====================================
         PALACE
    ====================================== -->

    <section
        class="jaipur-palace"
        id="palace"
    >


        <!-- =================================
             LEFT TOWER
        ================================== -->

        <div class="palace-tower tower-left">

            <div class="tower-dome">

                <span>✦</span>

            </div>

            <div class="tower-body">

                <div class="jharokha">

                    <div class="jharokha-arch"></div>

                    <div class="jharokha-window"></div>

                </div>

                <div class="tower-decoration">
                    ❖
                </div>

            </div>

        </div>


        <!-- =================================
             RIGHT TOWER
        ================================== -->

        <div class="palace-tower tower-right">

            <div class="tower-dome">

                <span>✦</span>

            </div>

            <div class="tower-body">

                <div class="jharokha">

                    <div class="jharokha-arch"></div>

                    <div class="jharokha-window"></div>

                </div>

                <div class="tower-decoration">
                    ❖
                </div>

            </div>

        </div>


        <!-- =================================
             CENTRAL ARCH
        ================================== -->

        <div class="royal-arch">


            <!-- Arch decorative layers -->

            <div class="arch-decoration arch-decoration-one"></div>

            <div class="arch-decoration arch-decoration-two"></div>


            <!-- Floral carving -->

            <div class="arch-floral">

                <span>❀</span>
                <span>❖</span>
                <span>❀</span>

            </div>


            <!-- Peacock decorations -->

            <div class="peacock peacock-left">
                🦚
            </div>

            <div class="peacock peacock-right">
                🦚
            </div>


            <!-- =================================
                 INNER DOORWAY
            ================================== -->

            <div class="doorway">


                <!-- Warm light behind doors -->

                <div class="door-light">

                    <div class="light-rays"></div>

                    <div class="light-center">
                        ✦
                    </div>

                </div>


                <!-- =================================
                     LEFT DOOR
                ================================== -->

                <div
                    class="jaipur-door door-left"
                    id="doorLeft"
                >

                    <div class="door-surface">

                        <div class="door-border">

                            <div class="door-carving carving-top">
                                ❖
                            </div>

                            <div class="door-carving carving-center">

                                <span>S</span>

                                <small>&</small>

                                <span>R</span>

                            </div>

                            <div class="door-floral">
                                ✿
                            </div>

                            <div class="door-panel"></div>

                        </div>

                    </div>

                </div>


                <!-- =================================
                     RIGHT DOOR
                ================================== -->

                <div
                    class="jaipur-door door-right"
                    id="doorRight"
                >

                    <div class="door-surface">

                        <div class="door-border">

                            <div class="door-carving carving-top">
                                ❖
                            </div>

                            <div class="door-carving carving-center">

                                <span>S</span>

                                <small>&</small>

                                <span>R</span>

                            </div>

                            <div class="door-floral">
                                ✿
                            </div>

                            <div class="door-panel"></div>

                        </div>

                    </div>

                </div>


                <!-- =================================
                     OPEN BUTTON
                ================================== -->

                <button
                    class="open-door-button"
                    id="openDoor"
                    type="button"
                >

                    <span class="button-symbol">
                        ♡
                    </span>

                    <span class="button-main" id="musicButton" type="button">
                        TAP TO OPEN
                    </span>

                    <span class="button-sub">
                        OUR WEDDING
                    </span>

                </button>


            </div>


        </div>


    </section>


    <!-- =====================================
         BOTTOM DECORATION
    ====================================== -->

    <footer class="royal-footer">

        <div class="footer-motif">
            ❀ &nbsp; ✦ &nbsp; ❀
        </div>

        <p>
            Shraddha Shukla Shukla & Rohit Mishra Mishra
        </p>

        <small>
            2nd DECEMBER 2026
        </small>

    </footer>


    <!-- =====================================
         GUEST NAME PANEL
    ====================================== -->

    <section
        class="guest-screen"
        id="guestScreen"
    >

        <div class="guest-glow"></div>


        <div class="guest-card">


            <!-- Top decoration -->

            <div class="guest-decoration">

                <span></span>

                <b>✦</b>

                <span></span>

            </div>


            <p class="guest-small-title">
                A ROYAL INVITATION
            </p>


            <h1>
                Welcome
            </h1>


            <p class="guest-question">
                May we know your name?
            </p>


            <p class="guest-description">
                So we may personally welcome you
                to our celebration.
            </p>


            <!-- Name form -->

            <form
                id="guestForm"
                autocomplete="off"
            >

                <div class="input-wrapper">

                    <input
                        type="text"
                        id="guestName"
                        name="guestName"
                        placeholder="Your name"
                        maxlength="40"
                        required
                    >

                </div>


                <button
                    class="enter-wedding-button"
                    type="submit"
                >

                    <span>
                        ENTER WEDDING
                    </span>

                    <b>
                        →
                    </b>

                </button>

            </form>


            <div class="guest-bottom-decoration">
                ❖
            </div>

        </div>

    </section>


    <!-- =====================================
         TRANSITION
    ====================================== -->

    <div
        class="page-transition"
        id="pageTransition"
    >

        <div class="transition-circle"></div>

    </div>


</main>



<script>


/* =========================================
   ELEMENTS
========================================= */

const palace =
    document.getElementById("palace");

const openDoor =
    document.getElementById("openDoor");

const guestScreen =
    document.getElementById("guestScreen");

const guestForm =
    document.getElementById("guestForm");

const guestName =
    document.getElementById("guestName");

const pageTransition =
    document.getElementById("pageTransition");


let doorsOpened = false;



/* =========================================
   OPEN PALACE DOORS
========================================= */

openDoor.addEventListener(
    "click",
    function () {

        if (doorsOpened) {
            return;
        }

        doorsOpened = true;


        /*
         * Start door opening animation.
         */

        palace.classList.add(
            "doors-open"
        );


        /*
         * Hide the open button.
         */

        openDoor.classList.add(
            "button-hidden"
        );


        /*
         * After the doors open,
         * reveal the name screen.
         */

        setTimeout(function () {

            guestScreen.classList.add(
                "guest-visible"
            );


            /*
             * Focus the name field
             * automatically.
             */

            setTimeout(function () {

                guestName.focus();

            }, 500);

        }, 1200);

    }
);



/* =========================================
   NAME SUBMISSION
========================================= */

guestForm.addEventListener(
    "submit",
    function (event) {

        event.preventDefault();


        const name =
            guestName.value.trim();


        /*
         * Do not continue if
         * name is empty.
         */

        if (!name) {

            guestName.focus();

            return;

        }


        /*
         * Save guest name.
         *
         * This name will be used
         * throughout the invitation.
         */

        localStorage.setItem(
            "guestName",
            name
        );


        /*
         * Start beautiful transition.
         */

        pageTransition.classList.add(
            "transition-active"
        );


        /*
         * IMPORTANT:
         *
         * We now go to your EXISTING
         * Wlc.html.
         */

        setTimeout(function () {

            window.location.href =
                "Wlc.html";

        }, 1000);

    }
);


// Wedding Background Music on Scroll

const weddingMusic = document.getElementById("weddingMusic");
const musicButton = document.getElementById("musicButton");

let musicStarted = false;

window.addEventListener("scroll", function startMusicOnScroll() {

    if (!musicStarted) {

        weddingMusic.play()
            .then(() => {
                musicStarted = true;
                musicButton.classList.add("playing");
                musicButton.innerHTML = "♫";
            })
            .catch(error => {
                console.log("Music playback blocked:", error);
            });

    }

}, { once: true });


// Music ON/OFF button

musicButton.addEventListener("click", function(event) {

    event.stopPropagation();

    if (weddingMusic.paused) {

        weddingMusic.play();
        musicButton.classList.add("playing");
        musicButton.innerHTML = "♫";

    } else {

        weddingMusic.pause();
        musicButton.classList.remove("playing");
        musicButton.innerHTML = "♪";

    }

});

</script>


</body>

</html>
